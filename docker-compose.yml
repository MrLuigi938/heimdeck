services:
  heimdeck:
    image: ghcr.io/mrluigi938/heimdeck:latest
    # Or build it yourself: use the next line instead of "image"
    # build: .
    container_name: heimdeck
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      # Optional: discover your containers automatically (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Etc/UTC   # your time zone, e.g. Europe/Berlin
      # Set to "true" if Heimdeck is only reachable via HTTPS (reverse proxy)
      - HEIMDECK_SECURE_COOKIE=false

# Even safer: expose the Docker socket through a proxy that only allows listing.
# Remove the socket line above and add the following:
#
#   heimdeck:
#     environment:
#       - DOCKER_HOST=tcp://socket-proxy:2375
#
#   socket-proxy:
#     image: tecnativa/docker-socket-proxy:latest
#     restart: unless-stopped
#     environment:
#       - CONTAINERS=1
#     volumes:
#       - /var/run/docker.sock:/var/run/docker.sock:ro
